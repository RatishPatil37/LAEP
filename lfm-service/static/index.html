<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAEP - Moon Trek Ice Prospectivity</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.5);
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: #111;
        }

        /* Darken map tiles for premium look */
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: contrast(1.2) brightness(0.7) grayscale(1);
        }

        /* Glassmorphic Overlay UI */
        .overlay-panel {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 380px;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 0 1px inset rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(120%);
            opacity: 0;
        }

        .overlay-panel.active {
            transform: translateX(0);
            opacity: 1;
        }

        .header {
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
        }

        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        
        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .coords-display {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .coord-box {
            display: flex;
            flex-direction: column;
        }

        .coord-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .coord-value {
            font-family: 'Space Grotesk', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .score-circle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            position: relative;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) 0%, rgba(255,255,255,0.05) 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 30px var(--accent-glow);
            transition: background 1s ease, box-shadow 0.3s ease;
        }

        .score-circle::before {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            background: var(--bg-color);
            border-radius: 50%;
        }

        .score-value {
            position: relative;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
        }

        .score-value span {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .alert-box {
            padding: 15px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .alert-box.danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }

        .alert-box.warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
        }

        .physical-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-item {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.02);
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .stat-value {
            font-weight: 600;
            font-size: 1rem;
        }

        /* Loader */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .loader-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .instruction {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        /* Custom Map Marker */
        .custom-marker {
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 15px var(--accent-glow);
            animation: markerPulse 1.5s infinite alternate;
        }
        
        @keyframes markerPulse {
            from { transform: scale(1); box-shadow: 0 0 10px var(--accent-glow); }
            to { transform: scale(1.3); box-shadow: 0 0 25px var(--accent); }
        }

    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="instruction" id="instructionTag">
        CLICK ANYWHERE ON THE MOON TO SCAN FOR ICE
    </div>

    <!-- UI Overlay -->
    <div class="overlay-panel" id="uiPanel">
        
        <div class="loader-overlay" id="loader">
            <div class="spinner"></div>
            <p style="font-size: 0.8rem; color: var(--accent); letter-spacing: 2px;">RUNNING LFM INFERENCE...</p>
        </div>

        <div class="header">
            <h1>LAEP Predictor</h1>
            <p>NASA LFM Gated Fusion Network</p>
        </div>

        <div class="coords-display">
            <div class="coord-box">
                <span class="coord-label">Latitude</span>
                <span class="coord-value" id="latDisplay">0.00°</span>
            </div>
            <div class="coord-box" style="align-items: flex-end;">
                <span class="coord-label">Longitude</span>
                <span class="coord-value" id="lonDisplay">0.00°</span>
            </div>
        </div>

        <div class="score-circle-container">
            <div class="score-circle" id="scoreCircle">
                <div class="score-value"><span id="scoreText">0</span><span>%</span></div>
            </div>
        </div>

        <div class="alert-box" id="alertBox">
            WAITING FOR SCAN...
        </div>

        <div class="physical-stats">
            <div class="stat-item">
                <div class="stat-label">ELEVATION (TMC-2)</div>
                <div class="stat-value" id="elevDisplay">-- m</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">TERRAIN SLOPE</div>
                <div class="stat-value" id="slopeDisplay">-- °</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map pointing to Moon South Pole Region
        const map = L.map('map', {
            center: [-86.5, -145.5],
            zoom: 5,
            minZoom: 2,
            maxZoom: 10,
            background: '#000'
        });

        // Add a Moon basemap tile layer (CartoDB Moon or OpenPlanetary)
        L.tileLayer('https://cartocdn-gmaps-a.global.ssl.fastly.net/base-moon/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://trek.nasa.gov/moon/">NASA Moon Trek</a>',
            noWrap: true
        }).addTo(map);

        let currentMarker = null;
        
        const customIcon = L.divIcon({
            className: 'custom-marker',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        // Handle Map Click
        map.on('click', async function(e) {
            const lat = e.latlng.lat;
            const lon = e.latlng.lng;
            
            // Hide instruction
            document.getElementById('instructionTag').style.opacity = '0';

            // Place Marker
            if (currentMarker) map.removeLayer(currentMarker);
            currentMarker = L.marker([lat, lon], {icon: customIcon}).addTo(map);

            // Update UI
            document.getElementById('uiPanel').classList.add('active');
            document.getElementById('loader').classList.add('active');
            document.getElementById('latDisplay').innerText = lat.toFixed(4) + '°';
            document.getElementById('lonDisplay').innerText = lon.toFixed(4) + '°';
            
            try {
                // Call FastAPI Backend
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ latitude: lat, longitude: lon })
                });
                
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);
                
                // Process Results
                updateUI(data);
                
            } catch (error) {
                console.error(error);
                document.getElementById('alertBox').className = 'alert-box danger';
                document.getElementById('alertBox').innerText = "CONNECTION ERROR TO LFM SERVER";
            } finally {
                document.getElementById('loader').classList.remove('active');
            }
        });

        function updateUI(data) {
            const score = data.ice_prospectivity_percent;
            const circle = document.getElementById('scoreCircle');
            const alertBox = document.getElementById('alertBox');
            
            // Animate Number Counter
            animateValue("scoreText", 0, score, 1000);
            
            // Determine Colors based on Score
            let color, glowColor;
            if (score > 70) {
                color = 'var(--success)';
                glowColor = 'rgba(16, 185, 129, 0.5)';
                alertBox.className = 'alert-box'; // default is success green
            } else if (score > 30) {
                color = '#f59e0b'; // warning orange
                glowColor = 'rgba(245, 158, 11, 0.5)';
                alertBox.className = 'alert-box warning';
            } else {
                color = 'var(--danger)';
                glowColor = 'rgba(239, 68, 68, 0.5)';
                alertBox.className = 'alert-box danger';
            }

            // Update Circle styling
            circle.style.background = `conic-gradient(${color} ${score}%, rgba(255,255,255,0.05) 0%)`;
            circle.style.boxShadow = `0 0 30px ${glowColor}`;
            document.getElementById('scoreText').style.color = color;
            
            // Update Text
            alertBox.innerText = data.message;
            document.getElementById('elevDisplay').innerText = data.elevation_m + " m";
            document.getElementById('slopeDisplay').innerText = data.slope_deg + " °";
        }
        
        // Number counting animation
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = (progress * (end - start) + start).toFixed(1);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }
    </script>
</body>
</html>
